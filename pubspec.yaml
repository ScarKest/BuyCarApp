name: buycar
description: A Very Good Project created by Very Good CLI.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.4.0 <3.22.2"
  flutter: 3.27.1

dependencies:
  bloc: ^8.1.0
  cloud_firestore: ^5.2.0
  firebase_core:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.0.1
  flutter_launcher_icons: ^0.14.1
  path_provider: ^2.0.11
  screenshot: ^3.0.0
  share_plus: ^10.1.2

dev_dependencies:
  flutter_lints: ^5.0.0
  very_good_analysis: ^6.0.0 

flutter_launcher_icons:
  android: true
  ios: false
  image_path_android: "assets/icon/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "assets/icon/icon.png" # only available for Android 8.0 devices and above
  adaptive_icon_foreground: "assets/icon/icon.png" # only available for Android 8.0 devices and above
  adaptive_icon_foreground_inset: 16 # only available for Android 8.0 devices and above
  adaptive_icon_monochrome: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/data/
    # - assets/icon/
